    - 'img[alt="avatar"]'
    - '.request-inspector'
  arquivo: images/ajuda/conversas/caixa-de-entrada.webp
  paginas:
    - docs/conversas/caixa-de-entrada-do-kinbox

# Botão "Enviar mensagem" (lápis) da lista: janela vazia com Canal, Contato, Número (+55) e Texto.
- id: conversas-enviar-mensagem
  url: /inbox/all
  passos:
    - esperar: '[aria-label="Enviar mensagem"]'
    - clicar: '[aria-label="Enviar mensagem"]'
    - esperar: '.ant-modal-content >> text=Número'
    - pausa: 800
  alvo: '.ant-modal-content'
  mascarar: []
  arquivo: images/ajuda/conversas/enviar-mensagem.webp
  paginas:
    - docs/conversas/iniciar-conversa

# "Mais ações" (três pontos) da conversa → "Agendar mensagem": janela com Data, Texto e Repetir mensalmente. Não salva.
