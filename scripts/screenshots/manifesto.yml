    - esperar: 'button[aria-label="Adicionar filtro"]'
    - clicar: 'button[aria-label="Adicionar filtro"]'
    - esperar: '.ant-drawer-title >> text=Gerenciar Filtros'
    - pausa: 800
  alvo:
    - '.ant-drawer-content:has-text("Gerenciar Filtros") .ant-drawer-header'
    - '.ant-drawer-content:has-text("Gerenciar Filtros") .ant-drawer-body :text("Parece que você ainda não possui")'
  mascarar: []
  arquivo: images/ajuda/conversas/gerenciar-filtros.webp
  paginas:
    - docs/conversas/criar-filtros-de-conversa

# "Novo filtro" dentro de Gerenciar Filtros: painel Criar filtro vazio, do título até o estado Resolvido (Nome, Descrição, Quem tem acesso?, Cor ou emoji, Condições, Estados com Aberto marcado).
