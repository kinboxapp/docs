# "Salvar mudanças" nem confirmam a exclusão. Nome, fuso, idioma e logo do workspace não mudam.
# Na Auditoria, a coluna Autor mostra o nome da conta de teste (pessoa real): leva tarja.

- id: workspace-geral-preferencias
  url: /settings/account/workspace
  altura: 1500
  passos:
    - esperar: 'div.text-md:text-is("Fuso horário")'
    - pausa: 800
    # O workspace de documentação não tem fuso nem moeda escolhidos: o print mostra a tela como está
    # (campos vazios) e o texto da página explica que valem Brasília e real.
  alvo:
    - 'h3:text-is("Preferências")'
    - 'div.card-bordered:has(div.text-md:text-is("Fuso horário"))'
  mascarar: []
  arquivo: images/ajuda/workspace/geral-preferencias.webp
  paginas:
    - docs/configuracoes-no-workspace/configuracoes-gerais

- id: workspace-mensagens-automaticas
  url: /settings/account/workspace
  passos:
    - esperar: 'div.text-md:text-is("Mensagem quando fora do horário comercial")'
    - clicar: '#settings_sendMessageWhenOutsideOfBusinessHours'
    - esperar: '#settings_messageOutsideOfBusinessHoursText'
    - digitar:
        seletor: '#settings_messageOutsideOfBusinessHoursText'
        texto: 'Olá! Nosso atendimento funciona de segunda a sexta, das 9h às 18h. Respondemos assim que voltarmos.'
    - pausa: 800
  alvo:
    - 'h3:text-is("Caixa de Entrada")'
    - 'div.py-6:has(div.text-md:text-is("Mensagem quando membro indisponível"))'
  mascarar: []
  arquivo: images/ajuda/workspace/mensagens-automaticas.webp
  paginas:
    - docs/administracao/mensagens-automaticas

- id: workspace-excluir-modal
  url: /settings/account/workspace
  passos:
    - esperar: 'div.text-md:text-is("Excluir ambiente")'
    - clicar: 'button:has-text("Excluir ambiente")'
    - esperar: '.ant-modal-content'
    - pausa: 800
  alvo: '.ant-modal-content'
  mascarar: []
  arquivo: images/ajuda/workspace/excluir-ambiente.webp
  paginas:
    - docs/administracao/excluir-workspace

- id: auditoria-lista
  url: /settings/audit
  passos:
    - esperar: 'tbody.ant-table-tbody tr:nth-child(6)'
    - pausa: 800
  # O cabeçalho do cartão vai até a borda direita do cartão: o recorte não corta a tabela seco à direita.
  alvo:
    - '.ant-card-head'
    - 'tbody.ant-table-tbody tr:nth-child(6)'
  mascarar:
    - 'tbody.ant-table-tbody tr td:first-child > div'
  arquivo: images/ajuda/workspace/auditoria-lista.webp
  paginas:
    - docs/administracao/auditoria
# --- Seção outros-canais (lote 8) ---
#
# Nada é conectado: os itens param antes de "Conectar canal" e "Criar canal". O campo de token recebe um marcador que não tem formato de token.

# Painel Conectar Telegram com Descrição e um marcador no campo do token, antes de clicar em Conectar canal.
- id: telegram-conectar
  url: /settings/channels/new
  passos:
    - clicar: 'text=Telegram'
    - esperar: 'input#identifier'
    - digitar: { seletor: '#description', texto: 'Atendimento da loja' }
    - digitar: { seletor: 'input#identifier', texto: '123456:seu-token-aqui' }
    - pausa: 600
  alvo:
    - '.ant-drawer-header'
    - '.ant-drawer-body button:has-text("Conectar canal")'
  mascarar: []
  arquivo: images/ajuda/outros-canais/telegram-conectar.webp
  paginas:
    - docs/canais/telegram

# Tela Canais > Sms com o texto sobre créditos e o botão Criar canal (o item não clica nele).
- id: sms-criar-canal
  url: /settings/channels/new/sms
  passos:
    - esperar: 'text=Cada disparo de SMS consome 1 crédito.'
    - pausa: 600
  alvo: '.ant-card:has-text("Adicionando canal de SMS")'
  mascarar: []
  arquivo: images/ajuda/outros-canais/sms-criar-canal.webp
  paginas:
    - docs/canais/sms

# Painel Canal de SMS do canal criado no workspace de documentação.
# Nenhum crédito é comprado: o item de compra abre o painel e para antes de "Comprar com PIX".
- id: sms-painel
  url: /settings/channels/258
  passos:
    - esperar: '.ant-drawer-body button:has-text("Comprar créditos")'
    - pausa: 800
  alvo:
    - '.ant-drawer-header'
    - '.ant-drawer-body button:has-text("Ver histórico")'
  mascarar: []
  arquivo: images/ajuda/outros-canais/sms-painel.webp
  paginas:
    - docs/canais/sms

# Painel Comprar créditos com o pacote padrão; o Total (preço) fica sob tarja.
- id: sms-comprar-creditos
  url: /settings/channels/258
  passos:
    - esperar: '.ant-drawer-body button:has-text("Comprar créditos")'
    - clicar: '.ant-drawer-body button:has-text("Comprar créditos")'
    - esperar: 'button:has-text("Comprar com PIX")'
    - pausa: 1000
  alvo:
    - '.ant-drawer-content-wrapper:has(button:has-text("Comprar com PIX")) .ant-drawer-header'
    - 'button:has-text("Comprar com PIX")'
  mascarar:
    - '.ant-form-item:has(label[title="Total"]) .ant-form-item-control-input-content'
  arquivo: images/ajuda/outros-canais/sms-comprar-creditos.webp
  paginas:
    - docs/canais/sms

# Seção salas (Atendimento › Salas)
#
# As salas não têm rota: o botão @ do topo abre o painel. Dados do seed (etapa `salas`): sala pública "Avisos" com
# mensagens fictícias, uma fixada, uma reação e uma resposta em thread, e a privada "Gerência". As mensagens saem em
# nome da conta de teste (proprietária real): foto e nome do autor sempre com tarja.
- id: salas-painel
  url: /
  passos:
    - clicar: 'button:has(i.fa-at)'
    - clicar: '.room-sidebar-scroll >> text=Avisos'
    - esperar: '[data-room-message] >> text=A nova coleção'
    # Sem o painel Membros e com Mensagens diretas recolhida: os membros fictícios do seed não aceitaram o convite
    - clicar: 'aside.room-panel .h-16 button.room-icon-button'
    - clicar: '.room-sidebar-scroll button:has-text("Mensagens diretas")'
    - pausa: 800
  alvo: '.rooms-drawer .ant-drawer-content'
  mascarar:
    - '.rooms-drawer figure'
    - '.rooms-drawer [data-room-message] span.truncate.font-semibold'
  arquivo: images/ajuda/salas/painel-das-salas.webp
  paginas:
    - docs/salas/visao-geral

- id: salas-nova-sala
  url: /
  passos:
    - clicar: 'button:has(i.fa-at)'
    - esperar: '.room-sidebar-scroll >> text=Avisos'
    - clicar: '.rooms-drawer button.room-icon-button >> nth=0'
    - esperar: '.ant-modal-content >> text=Criar nova sala'
    - digitar: { seletor: '.ant-modal-content input[type=text] >> nth=0', texto: 'Vendas' }
    - digitar: { seletor: '.ant-modal-content textarea', texto: 'Metas, campanhas e dúvidas sobre pedidos' }
    - clicar: '.ant-modal-content .ant-select:has-text("Pública")'
    - clicar: '.ant-select-dropdown:not(.ant-select-dropdown-hidden) >> text=Privada'
    - esperar: '.ant-modal-content >> text=Membros'
    - pausa: 600
  alvo: '.ant-modal-content'
  mascarar:
    - '.ant-modal-content .ant-select-multiple .ant-select-selection-item'
  arquivo: images/ajuda/salas/nova-sala.webp
  paginas:
    - docs/salas/usar-salas

- id: salas-acoes-mensagem
  url: /
  passos:
    - clicar: 'button:has(i.fa-at)'
    - clicar: '.room-sidebar-scroll >> text=Avisos'
    - esperar: '[data-room-message] >> text=A nova coleção'
    # Só a barra sobre a mensagem fixada: o menu ⋯ cobriria o texto das outras mensagens
    - passar: '[data-room-message]:has-text("Bom dia, equipe")'
    - pausa: 600
  alvo:
    - '[data-room-message]:has-text("Bom dia, equipe")'
    - '[data-room-message]:has-text("Bom dia, equipe") .room-toolbar-button >> nth=0'
    - '[data-room-message]:has-text("Bom dia, equipe") .room-toolbar-button >> nth=-1'
  mascarar:
    - '.rooms-drawer [data-room-message] figure'
    - '.rooms-drawer [data-room-message] span.truncate.font-semibold'
  arquivo: images/ajuda/salas/acoes-da-mensagem.webp
  paginas:
    - docs/salas/usar-salas

- id: salas-auditoria
  url: /
  passos:
    - clicar: 'button:has(i.fa-at)'
    - clicar: '.room-sidebar-scroll >> text=Auditoria'
    - esperar: '.rooms-drawer >> text=sem marcar nada como lido'
    - pausa: 600
  # Recorte: do topo do painel até o aviso do centro, sem o branco abaixo e sem a seção Mensagens diretas
  alvo:
    - '.room-sidebar-scroll .room-list-item:has-text("Gerência")'
    - '.rooms-drawer .ant-select'
    - '.rooms-drawer >> text=sem marcar nada como lido'
  mascarar: []
  arquivo: images/ajuda/salas/auditoria.webp
  paginas:
    - docs/salas/auditar-mensagens-diretas

# Seção cenarios (Automação e IA › Cenários)
#
# Os três cenários de exemplo vêm do seed (`bun seed.ts --so funil,bot,cenarios`) e ficam sempre desligados: nada roda
# nem chama endereço externo (o webhook de entrada grava um endereço fictício e a Requisição HTTP aponta para
# example.com). Os itens abrem o cenário pelo nome na lista, porque o id muda se o seed recriar o cenário. O endereço do
# webhook de entrada leva tarja em todo print. Sem print da janela de gatilhos nem do fim da lista Nova ação (recorte
# fixo). Sem print do Analítico: os cenários de exemplo nunca rodam, então a tela fica vazia. A janela "Webhook de
