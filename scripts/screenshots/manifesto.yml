  alvo:
    - '.ant-drawer-content:has-text("Criar filtro") .ant-drawer-header'
    - '.ant-drawer-content:has-text("Criar filtro") label:has-text("Resolvido")'
  mascarar: []
  arquivo: images/ajuda/conversas/novo-filtro.webp
  paginas:
    - docs/conversas/criar-filtros-de-conversa

# Configurações → Ambiente → Frases rápidas → Nova frase: painel Criar frase rápida vazio.
- id: conversas-frases-nova
  url: /settings/quick-phrases/new
  passos:
    - esperar: '.ant-drawer-title >> text=Criar frase rápida'
    - pausa: 800
  alvo: '.ant-drawer-content'
  mascarar: []
  arquivo: images/ajuda/conversas/nova-frase-rapida.webp
  paginas:
    - docs/conversas/criar-frases-rapidas-para-suas-conversas

# Seção conversas — caixa de entrada, iniciar, agendar e ações em lote

# Caixa de entrada (layout novo) sem conversa aberta: menu "Chat" (Abertos, Meus, Seguindo, Arquivados, Filtros) e a lista.
# A foto do membro atribuído é da conta dona (real): coberta com tarja. O selo "Stag" do staging fica fora ou coberto.
- id: conversas-caixa-de-entrada
  url: /inbox/all
  passos:
