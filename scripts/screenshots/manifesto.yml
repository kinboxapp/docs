# Fluxograma de exemplo montado na hora (Início → Coletar dados → Subagente → Transferir), sem publicar: puxar a
# seta do bloco e soltar no vazio cria o bloco ligado e abre "Selecione uma ação". Os blocos novos recebem os ids
# 1, 2 e 3; no fim, "Enquadrar" (último botão da barra inferior) mostra o desenho inteiro.
- id: agente-fluxograma
  url: /settings/agents/6b0793fd9f2e3f185bc07afa
  passos:
    - esperar: '#side-panel >> text=Canais conectados'
    - clicar: '#preview-panel button[class*="!size-11"] >> nth=1'
    - esperar: '#side-panel .react-flow__node-start'
    - pausa: 1000
    - arrastar:
        de: '#side-panel .react-flow__node-start .react-flow__handle.source'
        para: '#side-panel .react-flow__pane'
        x: 560
        y: 330
    - esperar: '.ant-modal-content:visible >> text=Selecione uma ação'
    - digitar:
        seletor: '.ant-modal-content:visible input'
        texto: 'Coletar dados'
    - clicar: '.ant-modal-content:visible a.cursor-pointer:has-text("Coletar dados")'
    - pausa: 1000
    - tecla: Escape
    - pausa: 800
    - arrastar:
        de: '#side-panel .react-flow__handle.source[data-nodeid="1"]'
        para: '#side-panel .react-flow__pane'
        x: 560
        y: 560
    - esperar: '.ant-modal-content:visible >> text=Selecione uma ação'
    - digitar:
        seletor: '.ant-modal-content:visible input'
        texto: 'Subagente'
    - clicar: '.ant-modal-content:visible a.cursor-pointer:has-text("Subagente")'
    - pausa: 1000
    - tecla: Escape
    - pausa: 800
    - arrastar:
        de: '#side-panel .react-flow__handle.source[data-nodeid="2"]'
        para: '#side-panel .react-flow__pane'
        x: 560
        y: 560
    - esperar: '.ant-modal-content:visible >> text=Selecione uma ação'
    - digitar:
        seletor: '.ant-modal-content:visible input'
        texto: 'Transferir'
    - clicar: '.ant-modal-content:visible a.cursor-pointer:has-text("Transferir")'
    - pausa: 1000
    - tecla: Escape
    - pausa: 800
    - clicar: '#side-panel [class*="_board_bottom_center"] button >> nth=-1'
    - pausa: 1500
  alvo:
    - '#side-panel .react-flow__node-start'
    - '#side-panel .react-flow__node[data-id="1"]'
    - '#side-panel .react-flow__node[data-id="2"]'
    - '#side-panel .react-flow__node[data-id="3"]'
  mascarar: []
  arquivo: images/ajuda/agente-de-ia/fluxograma.webp
  paginas:
    - docs/agente-de-ia/fluxograma-e-etapas

