    - clicar: '[aria-label="Mais ações"]'
    - esperar: '.ant-dropdown-menu-item >> text=Agendar mensagem'
    - clicar: '.ant-dropdown-menu-item >> text=Agendar mensagem'
    - esperar: '.ant-modal-content >> text=Repetir mensalmente'
    - pausa: 800
  alvo: '.ant-modal-content'
  mascarar: []
  arquivo: images/ajuda/conversas/agendar-mensagem.webp
  paginas:
    - docs/conversas/agendar-mensagem

# Lista → "Mais opções" → "Executar ação..." → Ação = "Exportar conversas": Período e o resumo do arquivo. Não executa.
- id: conversas-exportar-conversas
  url: /inbox/all
