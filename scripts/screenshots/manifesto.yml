    - clicar: '[aria-label="Mais opções"]'
    - esperar: '.ant-dropdown-menu-item >> text=Executar ação...'
    - clicar: '.ant-dropdown-menu-item >> text=Executar ação...'
    - esperar: '.ant-modal-content >> text=Executar ação em lote'
    - clicar: '.ant-modal-content .ant-select-selector'
    - esperar: '.ant-select-item-option >> text=Exportar conversas'
