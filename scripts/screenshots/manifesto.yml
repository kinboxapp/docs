# Prints da central de ajuda. Formato em plans/central-de-ajuda/03-skill-deploy-docs.md §2.E.
#
# id        identificador usado em `--ids`
# url       caminho no app (staging web), já dentro do workspace de documentação
# passos    ações antes do print: esperar, clicar, digitar {seletor, texto}, tecla, pausa (ms)
# alvo      seletor do recorte; uma lista recorta o retângulo que cobre todos
# mascarar  seletores cobertos por uma tarja sólida antes do print (dados que não podem aparecer); seletor que não acha
#           nenhum elemento faz o item falhar
# esconder  (opcional) seletores escondidos antes do print: o que o cliente nunca vê (menu Admin da conta de teste,
#           selo de staging)
# arquivo   saída em images/ajuda/<secao>/<nome>.webp
# paginas   páginas da central que usam o print
# largura  (opcional) largura da janela em px só para o item (padrão 1440; abaixo de 768 o app troca de layout)
# workspace (opcional) workspace do print; padrão: o de documentação. Outro workspace só para telas
#           que o de documentação não tem (ex.: canal de WhatsApp) e sempre com `mascarar`

- id: tags-lista
  url: /settings/tags
  passos:
    - esperar: '.g_table_wrapper >> text=VIP'
  alvo:
    - '.g_card > header'
    - '.g_card .g_table_wrapper'
  mascarar: []
  arquivo: images/ajuda/tags/lista-de-tags.webp
  paginas: []

# Seção whatsapp (Canais › WhatsApp › QR Code)
#
# O workspace de documentação (Loja Exemplo) não tem canal de WhatsApp: criar um canal Express cria uma conexão real
# na conta do motor (compartilhada com produção) e um QR Code publicado poderia ser lido por qualquer pessoa. Por isso
# as telas de canal de WhatsApp vêm do workspace de testes (id 1, "Kinbox"), com tarja sólida sobre nome do canal e
# número, e recorte só do bloco que a página usa. Nunca capture QR Code nem código de conexão gerado.

- id: canais-lista
  url: /settings/channels
  largura: 900
  passos:
    - esperar: 'tbody tr[data-index="0"]'
  alvo:
    - 'button:has-text("Novo canal")'
    - 'tbody tr[data-index="0"]'
  mascarar: []
  arquivo: images/ajuda/whatsapp/lista-de-canais.webp
  paginas:
    - docs/canais/visao-geral

- id: whatsapp-qr-conectar
  url: /settings/channels/new/whatsapp/web
  passos:
    - esperar: '.ant-drawer-content >> text=Opções avançadas'
    - clicar: '.ant-drawer-content >> text=Opções avançadas'
    - esperar: '.ant-drawer-content >> text=Modo antigo'
  alvo:
    - '.ant-drawer-header'
    - '.ant-drawer-body button:has-text("Conectar canal")'
  mascarar: []
  arquivo: images/ajuda/whatsapp/conectar-whatsapp-qr-code.webp
  paginas:
    - docs/canais/conectar-whatsapp-app

# Canal Express conectado do workspace de testes (id 1). Tarja sobre o nome do canal e o número; o recorte
# termina em "Restringir visibilidade", antes do Aquecedor (beta) e dos campos personalizados.
- id: whatsapp-qr-canal-express
  workspace: Kinbox
  url: /settings/channels/245
  passos:
    - esperar: '.ant-drawer-content #isPrivate'
    - pausa: 1500
  alvo:
    - '.ant-drawer-header'
    - '.ant-drawer-body #isPrivate'
  mascarar:
    - '.ant-drawer-title .truncate'
    - '.ant-drawer-body #description'
    - '.ant-drawer-body #phone'
  arquivo: images/ajuda/whatsapp/canal-express.webp
  paginas:
    - docs/canais/whatsapp/whatsapp-app/configuracoes

# Só o bloco Ações do mesmo canal Express (página de desconexão). A tarja no título só satisfaz a regra de mascarar:
# o título fica fora do recorte.
- id: whatsapp-qr-acoes
  workspace: Kinbox
  url: /settings/channels/245
  passos:
    - esperar: '.ant-drawer-body a:has(.fa-power-off)'
    - pausa: 1000
  alvo: '.ant-drawer-body .ant-form-item:has(.fa-power-off)'
  mascarar:
    - '.ant-drawer-title .truncate'
  arquivo: images/ajuda/whatsapp/acoes-do-canal.webp
  paginas:
    - docs/canais/whatsapp/whatsapp-app/como-evitar-que-o-celular-desconecte

# Confirmação de "Recriar" num canal Clássica do workspace de testes (id 1). Só o modal entra no recorte;
# o nome e o número do canal ficam fora do recorte. A tarja (por cima de tudo, inclusive do modal) fica só no título,
# que também está fora do recorte: tarja em campo atrás do modal apareceria na borda do print. Não confirme: o print só abre o modal.
- id: whatsapp-classica-recriar
  workspace: Kinbox
  url: /settings/channels/254
  passos:
    - esperar: '.ant-drawer-body a:has(.fa-power-off)'
    - clicar: '.ant-drawer-body a:has(.fa-power-off)'
    - esperar: '.ant-modal-confirm >> text=Tipo de conexão'
    - pausa: 800
  alvo: '.ant-modal-confirm .ant-modal-content'
  mascarar:
    - '.ant-drawer-title'
  arquivo: images/ajuda/whatsapp/recriar-classica-para-express.webp
  paginas:
    - docs/canais/whatsapp/whatsapp-app/migracao-tipo-classico-para-alternativo

# Painel do código de conexão (Express) ANTES de gerar o código: só campo, botão e link, sem código na tela.
# Precisa de um canal Express do workspace de testes no status "Necessário ler QR-Code" (canal 251, de QA, com número
# fictício). Se ele não estiver aguardando leitura, use Reiniciar canal nele antes. Nunca capture QR Code nem código.
- id: whatsapp-qr-codigo-de-conexao
  workspace: Kinbox
  url: /settings/channels/251
  passos:
    - esperar: '.ant-drawer-body button:has-text("Conectar com número de telefone")'
    - clicar: '.ant-drawer-body button:has-text("Conectar com número de telefone")'
    - esperar: '.ant-drawer-body button:has-text("Gerar código")'
    - pausa: 800
  alvo: '.ant-drawer-body .ant-form-item:has(label[title="Conectar com número de telefone"])'
  mascarar:
    - '.ant-drawer-body input[placeholder="Número do WhatsApp"]'
  arquivo: images/ajuda/whatsapp/conectar-com-numero-de-telefone.webp
  paginas:
    - docs/canais/conectar-whatsapp-app

# Seção whatsapp-oficial (Canais › WhatsApp › WhatsApp oficial)

# Tela "API Oficial" antes de abrir a janela da Meta, no workspace de documentação. Não clica no botão:
# a janela da Meta é de terceiros e criaria um canal real.
- id: whatsapp-oficial-conectar
  url: /settings/channels/new/whatsapp/embedded
  passos:
    - esperar: '.g_settings_simple_page button:has-text("Conectar WhatsApp")'
    - pausa: 800
  alvo:
    - '.g_settings_simple_page .ant-card-head'
    - '.g_settings_simple_page .ant-card-body'
  mascarar: []
  arquivo: images/ajuda/whatsapp-oficial/conectar-api-oficial.webp
  paginas:
    - docs/canais/whatsapp-api-oficial-padrao

# Aviso amarelo da verificação na Meta num canal oficial de teste do workspace de testes (id 1).
# Só o aviso entra no recorte; título, número, IDs e token do canal ficam borrados e fora do recorte.
- id: whatsapp-oficial-aviso-canal
  workspace: Kinbox
  url: /settings/channels/2
  passos:
    - esperar: '.ant-drawer-body .ant-alert'
    - pausa: 1000
  alvo: '.ant-drawer-body .ant-alert'
  mascarar:
    - '.ant-drawer-title'
    - '.ant-drawer-body #description'
    - '.ant-drawer-body #phone'
    - '.ant-drawer-body #waba_id'
    - '.ant-drawer-body #identifier'
    - '.ant-drawer-body #hashIdentifier'
  arquivo: images/ajuda/whatsapp-oficial/aviso-mais-de-um-app.webp
  paginas:
    - docs/canais/whatsapp/whatsapp-cloud-api/problemas-comuns

# Editor de uma conversa do canal oficial de teste (workspace 1) com a janela aberta: contador no canto.
# Só o editor entra no recorte (sem nome, número nem mensagens do contato). A conversa precisa ter
# recebido mensagem do contato nas últimas 24 h; se a janela fechar, troque o id por outra conversa aberta.
- id: whatsapp-oficial-janela-aberta
  workspace: Kinbox
  url: /inbox/all/3313
  passos:
    - esperar: '.g_chat_countdown'
    - pausa: 1000
  alvo: '.chat-actions-box'
  mascarar:
    - '.message-box'
  arquivo: images/ajuda/whatsapp-oficial/janela-aberta-contador.webp
  paginas:
    - docs/canais/whatsapp/whatsapp-cloud-api/janela-de-24-horas

# Conversa do canal oficial de teste (workspace 1) com a janela de 24 h encerrada e poucas mensagens:
# aviso do topo, área vazia e o rodapé com os dois botões. A única mensagem e o nome do membro que enviou
# ficam cobertos; o cabeçalho com o nome do contato fica fora do recorte.
- id: whatsapp-oficial-janela-encerrada
  workspace: Kinbox
  url: /inbox/all/4248
  passos:
    - esperar: '.finished-chat-footer:visible >> text=Enviar nota de time'
    - esperar: '.closed-conversation-banner'
    - pausa: 1000
  alvo:
    - '.closed-conversation-banner'
    - '.finished-chat-footer:visible'
  mascarar:
    - '.message:not(.system)'
    - '.message .user-name'
    - '.g_chat_header_inner'
  arquivo: images/ajuda/whatsapp-oficial/janela-encerrada.webp
  paginas:
    - docs/canais/whatsapp/whatsapp-cloud-api/janela-de-24-horas

# Seção conceitos

# Tela inteira no workspace de documentação, para mostrar as peças: cabeçalho com o botão do ambiente ("Loja Exemplo"),
# menu lateral inteiro (só ícones), painel Chat e a lista de conversas. O item "Admin" (só da conta de teste) e o selo
# de staging somem do print; a foto do membro no cabeçalho e as fotos na lista levam tarja.
- id: conceitos-caixa-de-entrada
  url: /inbox/all
  passos:
    - esperar: 'a[href="/inbox/archived"]'
    - esperar: 'text=Cliente Novo'
    - pausa: 1000
  alvo: body
  esconder:
    - 'a[href="/admin"]'
    - '.react-draggable:has(.fa-vial)'
  mascarar:
    - '.g_user_avatar'
    - 'img[alt="avatar"]'
  arquivo: images/ajuda/conceitos/caixa-de-entrada.webp
  paginas:
    - docs/conceitos/visao-geral

# Seção assinatura (Administração › Assinatura e cobrança)
#
# Só telas que não disparam cobrança: nenhum item clica em Continuar, Alterar Plano, Contratar, Salvar nem confirma
# o cancelamento. Preços, saldo, valor sugerido da recarga e limite do alerta saem com tarja (o guia não publica valores).

- id: assinatura-seu-plano
  url: /settings/billing
  passos:
    - esperar: 'text=Mudar plano'
    - pausa: 1000
  alvo: '.card-bordered:has(h1:has-text("PRO"))'
  mascarar:
    - 'span:has-text("por R$")'
    - 'div.text-lg.font-semibold:has-text("R$")'
  arquivo: images/ajuda/assinatura/seu-plano.webp
  paginas:
    - docs/assinatura/visao-geral

- id: assinatura-alterar-plano
  url: /settings/billing/subscription
  passos:
    - esperar: '.billing-space .right >> text=Resumo da fatura'
    - esperar: '.billing-total-value'
    - pausa: 1500
  alvo:
    - '.billing-space .left .billing-box'
    - '.billing-space .left .billing-box >> nth=1'
    - '.billing-space .right .billing-box'
  mascarar:
    - '.billing-total-per-user'
    - '.billing-item-value'
    - '.billing-total-value'
  arquivo: images/ajuda/assinatura/alterar-plano.webp
  paginas:
    - docs/assinatura/assinar-ou-mudar-plano

- id: assinatura-adicionar-saldo
  url: /settings/billing
  passos:
    - esperar: 'text=Adicionar saldo'
    - clicar: 'text=Adicionar saldo'
    - esperar: '.ant-modal-content >> text=Valor a adicionar'
    - pausa: 800
  alvo: '.ant-modal-content'
  mascarar:
    - '.ant-modal-content .ant-input-number-input'
  arquivo: images/ajuda/assinatura/adicionar-saldo.webp
  paginas:
    - docs/assinatura/adicionar-saldo

- id: assinatura-historico-de-recargas
  url: /settings/billing/recharges-history
  passos:
    - esperar: 'button:has-text("Alerta de saldo")'
    - pausa: 800
  alvo:
    - 'text=Histórico de recargas'
    - 'button:has-text("Adicionar Saldo")'
    - 'button:has-text("Ver relatório de uso")'
  mascarar:
    - 'button:has-text("Alerta de saldo") > span'
  arquivo: images/ajuda/assinatura/historico-de-recargas.webp
  paginas:
    - docs/assinatura/alerta-de-saldo

- id: assinatura-alerta-de-saldo
  url: /settings/billing/recharges-history
  passos:
    - esperar: 'button:has-text("Alerta de saldo")'
    - clicar: 'button:has-text("Alerta de saldo")'
    - esperar: '.ant-modal-content >> text=Avisar quando o saldo ficar abaixo de'
    - pausa: 800
  alvo: '.ant-modal-content'
  mascarar:
    - '.ant-modal-content .ant-input-number-input'
    - '.ant-modal-content .bg-base-200'
  arquivo: images/ajuda/assinatura/alerta-de-saldo.webp
  paginas:
    - docs/assinatura/alerta-de-saldo
