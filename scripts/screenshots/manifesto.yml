    - esperar: 'button[aria-label="Adicionar filtro"]'
    - clicar: 'button[aria-label="Adicionar filtro"]'
    - esperar: 'button[aria-label="Novo filtro"]'
    - clicar: 'button[aria-label="Novo filtro"]'
    - esperar: '.ant-drawer-title >> text=Criar filtro'
